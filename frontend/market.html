<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nyris — Marché</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script defer src="assets/js/api.js"></script>
  <script defer src="assets/js/format.js"></script>
  <script defer src="assets/js/shell.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="shell-header"></div>
  <main class="max-w-6xl mx-auto px-4 py-6">
    <div id="error-banner"></div>

    <div x-data="marketPage()" x-init="init()" x-cloak>
      <div class="flex items-center justify-between mb-4 gap-2 flex-wrap">
        <h1 class="text-lg font-semibold text-slate-900">Marché / Watchlist</h1>
        <div class="flex gap-2">
          <button @click="refresh()" :disabled="loading"
            class="border border-slate-300 text-slate-700 px-3 py-1.5 rounded-md text-sm hover:bg-slate-100 disabled:opacity-50">
            <span x-text="loading ? 'Chargement…' : 'Rafraîchir'"></span>
          </button>
          <button @click="sync()" :disabled="syncing"
            class="bg-slate-900 text-white px-3 py-1.5 rounded-md text-sm hover:bg-slate-700 disabled:opacity-50">
            <span x-text="syncing ? 'Sync…' : 'Sync Binance'"></span>
          </button>
        </div>
      </div>

      <div class="bg-white rounded-lg border border-slate-200 overflow-x-auto">
        <table class="text-sm">
          <thead>
            <tr class="text-left text-xs font-medium text-slate-500 uppercase">
              <th class="px-3 py-2">Symbole</th>
              <th class="px-3 py-2">Nom</th>
              <th class="px-3 py-2">Statut</th>
              <th class="px-3 py-2">Tradable</th>
              <th class="px-3 py-2">Paire Binance</th>
              <th class="px-3 py-2 text-right">Prix (EUR)</th>
              <th class="px-3 py-2">Sync</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="a in assets" :key="a.id">
              <tr class="border-t border-slate-100">
                <td class="px-3 py-2 font-medium" x-text="a.symbol"></td>
                <td class="px-3 py-2 text-slate-600" x-text="a.display_name"></td>
                <td class="px-3 py-2">
                  <span class="px-2 py-0.5 rounded text-xs font-medium" :class="statusClass(a.status)" x-text="a.status"></span>
                </td>
                <td class="px-3 py-2">
                  <span class="px-2 py-0.5 rounded text-xs font-medium"
                    :class="a.is_tradeable ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'"
                    x-text="a.is_tradeable ? 'Oui' : 'Non'"></span>
                </td>
                <td class="px-3 py-2 text-slate-600" x-text="a.binance_symbol || '—'"></td>
                <td class="px-3 py-2 text-right tnum" x-text="price(a.symbol) !== undefined ? fmt.priceEur(price(a.symbol)) : '—'"></td>
                <td class="px-3 py-2 text-xs text-slate-400" x-text="fmt.dt(a.market_synced_at)"></td>
              </tr>
            </template>
            <tr x-show="loading">
              <td colspan="7" class="px-3 py-6 text-center text-slate-500"><span class="spinner"></span> Chargement…</td>
            </tr>
            <tr x-show="!loading && assets.length === 0">
              <td colspan="7" class="px-3 py-6 text-center text-slate-400">Aucun actif.</td>
            </tr>
          </tbody>
        </table>
      </div>
      <p class="text-xs text-slate-400 mt-2">Prix EUR uniquement (paires directes Binance Spot). Les actifs sans paire EUR n'ont pas de prix.</p>
    </div>
  </main>

  <script>
    function marketPage() {
      return {
        loading: true,
        syncing: false,
        assets: [],
        prices: {},
        async init() {
          await this.refresh();
        },
        async refresh() {
          this.loading = true;
          shell.clearError();
          try {
            const assets = await api.getAssets();
            let prices = { prices: [] };
            try {
              prices = await api.getMarketPrices();
            } catch (e) {
              /* prix optionnels : on n'échoue pas la page si Binance indispo */
            }
            this.assets = assets;
            const map = {};
            (prices.prices || []).forEach((p) => (map[p.symbol] = p.price));
            this.prices = map;
          } catch (e) {
            shell.showError("Chargement marché : " + e.message);
          } finally {
            this.loading = false;
          }
        },
        async sync() {
          this.syncing = true;
          shell.clearError();
          try {
            const r = await api.postMarketSync();
            shell.showInfo(`Sync OK — ${r.tradable} tradables, ${r.not_listed} non listés.`);
            await this.refresh();
          } catch (e) {
            shell.showError("Sync Binance : " + e.message);
          } finally {
            this.syncing = false;
          }
        },
        statusClass(s) {
          return s === "active"
            ? "bg-emerald-100 text-emerald-700"
            : s === "watch_only"
              ? "bg-amber-100 text-amber-700"
              : "bg-slate-200 text-slate-600";
        },
        price(sym) {
          return this.prices[sym];
        },
      };
    }
  </script>
</body>
</html>
